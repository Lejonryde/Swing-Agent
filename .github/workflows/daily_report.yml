name: SWINGKINGS Daily Discord Report

on:
  schedule:
    # Körs mån-fre kl 07:30 UTC (motsvarar kl 08:30 svensk tid)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # Gör att du även kan starta flödet manuellt via GitHub

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Run agents and send report to Discord
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python agent.py
