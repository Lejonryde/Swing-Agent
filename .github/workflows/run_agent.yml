name: Run AI Swing Agent

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # Körs kl 07:30 UTC (08:30 svensk tid) varje vardag (måndag till fredag)
    - cron: '30 7 * * 1-5'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Ladda ner koden
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installera beroenden
        run: pip install yfinance pandas ta openai

      - name: Kör Högrisk-agenten
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python agent.py
